name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        # actions/checkout@v6 — pinned to immutable SHA.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python@v6 — pinned to immutable SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bootstrap diagnostics
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version
          python -c "import platform; print('platform:', platform.platform())"

      - name: Install editable dev environment
        run: python -m pip install -e '.[dev]'

      - name: Compile source
        run: python -m compileall -q src

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Type-check with mypy
        run: python -m mypy src

      - name: Run pytest with coverage
        run: python -m pytest --cov=venice_media_skill --cov-report=term-missing

      - name: Validate OpenAPI snapshot
        run: python -m venice_media_skill validate-openapi references/venice-openapi.yaml

      - name: Build wheel + sdist
        run: python -m build

      - name: Inspect sdist for forbidden entries
        run: python scripts/inspect-sdist.py

      - name: Verify bundled skill/reference mirrors
        run: python scripts/verify-bundled-assets.py

  cross-platform-smoke:
    name: Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        # actions/checkout@v6 — pinned to immutable SHA.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        # actions/setup-python@v6 — pinned to immutable SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap diagnostics
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version
          python -c "import platform; print('platform:', platform.platform())"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build wheel + sdist
        run: python -m build

      - name: Install the built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0]])"

      - name: Smoke schema command
        run: python -m venice_media_skill schema

      - name: Smoke OpenAPI validation
        run: python -m venice_media_skill validate-openapi references/venice-openapi.yaml

      - name: Smoke doctor command
        run: python -m venice_media_skill doctor
        env:
          VENICE_MEDIA_CONFIG_DIR: ${{ runner.temp }}/venice-media/config
          VENICE_MEDIA_CACHE_DIR: ${{ runner.temp }}/venice-media/cache
          VENICE_MEDIA_STATE_DIR: ${{ runner.temp }}/venice-media/state
          VENICE_MEDIA_OUTPUT_DIR: ${{ runner.temp }}/venice-media/output

  wheel-smoke:
    name: Wheel install smoke / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        # actions/checkout@v6 — pinned to immutable SHA.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python@v6 — pinned to immutable SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bootstrap diagnostics
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version
          python -c "import platform; print('platform:', platform.platform())"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel + sdist
        run: python -m build

      - name: Install wheel in fresh venv (no -e flag)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install dist/venice_media_skill-*-py3-none-any.whl

      - name: Smoke the installed console script + bundled assets
        run: |
          set -e
          /tmp/wheel-venv/bin/venice-media --help >/dev/null
          /tmp/wheel-venv/bin/venice-media schema >/dev/null
          /tmp/wheel-venv/bin/venice-media validate-openapi "$(pwd)/references/venice-openapi.yaml"
          /tmp/wheel-venv/bin/python -c "
          from importlib import resources
          root = resources.files('venice_media_skill.assets.skill')
          assert (root / 'SKILL.md').is_file(), 'SKILL.md missing'
          assert (root / 'references' / 'venice-openapi.yaml').is_file(), \
              'bundled OpenAPI yaml missing'
          print('wheel-smoke: bundled assets reachable via importlib.resources')
          "

      - name: Install and smoke the sdist in a second clean venv
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/python -m pip install dist/venice_media_skill-*.tar.gz
          (cd /tmp && /tmp/sdist-venv/bin/venice-media schema >/dev/null)
          (cd /tmp && /tmp/sdist-venv/bin/venice-media validate-openapi >/dev/null)

  minimum-deps:
    name: Lower-bound deps / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # actions/checkout@v6 — pinned to immutable SHA.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.13
        # actions/setup-python@v6 — pinned to immutable SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Bootstrap diagnostics
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version

      - name: Install pins matching pyproject.toml lower bounds
        run: |
          python -m pip install \
            "httpx==0.28.1" \
            "jsonschema==4.23.0" \
            "openapi-spec-validator==0.7.1" \
            "platformdirs==4.3.6" \
            "PyYAML==6.0.2"
          python -m pip install -e .

      - name: Smoke the bridge against the lowest acceptable dependencies
        env:
          VENICE_MEDIA_CONFIG_DIR: ${{ runner.temp }}/venice-media/config
          VENICE_MEDIA_CACHE_DIR: ${{ runner.temp }}/venice-media/cache
          VENICE_MEDIA_STATE_DIR: ${{ runner.temp }}/venice-media/state
          VENICE_MEDIA_OUTPUT_DIR: ${{ runner.temp }}/venice-media/output
        run: |
          python -c "import httpx, platformdirs, yaml; \
            assert httpx.__version__ == '0.28.1'; \
            assert tuple(int(p) for p in platformdirs.__version__.split('.')[:2]) >= (4, 3); \
            assert tuple(int(p) for p in yaml.__version__.split('.')[:2]) >= (6, 0)"
          python -m venice_media_skill --help >/dev/null
          python -m venice_media_skill schema >/dev/null
          python -m venice_media_skill doctor
          python -m pip check
          echo "minimum-deps: all declared runtime lower bounds import cleanly"

  security:
    name: Dependency and source security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        # actions/checkout@v6 — pinned to immutable SHA.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.12
        # actions/setup-python@v6 — pinned to immutable SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap diagnostics
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version

      - name: Install package + security tools
        run: python -m pip install -e . pip-audit bandit

      - name: Audit Python dependencies
        run: python -m pip_audit

      - name: Scan source with Bandit
        run: python -m bandit -q -r src

      - name: Verify installed package set
        run: python -m pip check
