name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # Stay on a currently supported major version. Major-version bumps must
        # be verified against the GitHub runner fleet before merging.
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        # Stay on a currently supported major version. Major-version bumps must
        # be verified against the GitHub runner fleet before merging.
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap diagnostics
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version
          python -c "import platform; print('platform:', platform.platform())"

      - name: Install editable dev environment
        run: python -m pip install -e '.[dev]'

      - name: Verify tag, package version, and changelog
        run: python scripts/verify-release.py "${GITHUB_REF_NAME}"

      - name: Run full validation contract
        run: ./scripts/validate.sh

      - name: Build source repository archives
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="venice-media-skill-${VERSION}/" \
            --output="dist/venice-media-skill-${VERSION}-source.zip" HEAD
          git archive --format=tar.gz --prefix="venice-media-skill-${VERSION}/" \
            --output="dist/venice-media-skill-${VERSION}-source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub release
        # Pinned to an immutable commit SHA. Verify the SHA against the
        # upstream release notes before bumping the major version.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/*
          generate_release_notes: true
