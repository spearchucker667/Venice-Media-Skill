name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        # actions/checkout@v6 — pinned to immutable SHA.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        # actions/setup-python@v6 — pinned to immutable SHA.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap diagnostics
        run: |
          python -m pip install --upgrade pip
          python --version
          pip --version
          python -c "import platform; print('platform:', platform.platform())"

      - name: Verify release commit is on origin/main
        shell: bash
        run: |
          git fetch origin --tags --prune
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release commit ${GITHUB_SHA} is not contained in origin/main" >&2
            exit 1
          fi

      - name: Install editable dev environment
        run: python -m pip install -e '.[dev]'

      - name: Verify tag, package version, fallback version, and changelog
        run: python scripts/verify-release.py "${GITHUB_REF_NAME}"

      - name: Run full validation contract
        run: ./scripts/validate.sh

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke install built wheel in fresh venv
        shell: bash
        run: |
          set -e
          python -m venv /tmp/release-wheel-venv
          /tmp/release-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/release-wheel-venv/bin/python -m pip install dist/venice_media_skill-*-py3-none-any.whl
          /tmp/release-wheel-venv/bin/venice-media --help >/dev/null
          /tmp/release-wheel-venv/bin/venice-media schema >/dev/null
          /tmp/release-wheel-venv/bin/venice-media doctor
          /tmp/release-wheel-venv/bin/python -m pip check
        env:
          VENICE_MEDIA_CONFIG_DIR: /tmp/venice-media/config
          VENICE_MEDIA_CACHE_DIR: /tmp/venice-media/cache
          VENICE_MEDIA_STATE_DIR: /tmp/venice-media/state
          VENICE_MEDIA_OUTPUT_DIR: /tmp/venice-media/output

      - name: Build source repository archives and checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="venice-media-skill-${VERSION}/" \
            --output="dist/venice-media-skill-${VERSION}-source.zip" HEAD
          git archive --format=tar.gz --prefix="venice-media-skill-${VERSION}/" \
            --output="dist/venice-media-skill-${VERSION}-source.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Extract release notes from CHANGELOG.md
        run: python scripts/extract-changelog-notes.py "${GITHUB_REF_NAME}" --output release-notes.md

      - name: Create GitHub release
        # softprops/action-gh-release@v2.2.2 — pinned to immutable SHA.
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: |
            dist/*
          body_path: release-notes.md
          generate_release_notes: true
